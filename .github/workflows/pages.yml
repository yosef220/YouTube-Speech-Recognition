name: Deploy web/ to GitHub Pages

# Publishes the static frontend (web/index.html) to GitHub Pages on every push
# to the default branch. No build step — it's a single self-contained HTML file.
on:
  push:
    # The github-pages environment only lets the repo's DEFAULT branch deploy;
    # a push from any other branch is rejected by that rule. This repo's default
    # is claude/humming-song-search-ace9y4, so only it is listed here — that
    # keeps every triggered run deployable (no failing/cancelled noise).
    # To publish from `main` instead: make `main` the default branch
    # (Settings → General → Default branch), then change this to [main].
    branches: [claude/humming-song-search-ace9y4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish before the next starts.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site automatically on first run if the repo allows
          # it, so no manual Settings toggle is needed.
          enablement: true
      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
